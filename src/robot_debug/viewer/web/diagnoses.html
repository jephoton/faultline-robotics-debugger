<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Faultline diagnoses</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div><p class="eyebrow">PHYSICAL AI / FAILURE FORENSICS</p><h1>Faultline diagnoses</h1></div>
    <nav aria-label="Viewer pages"><a href="/">Episode evidence</a></nav>
  </header>
  <div class="workspace">
    <nav class="run-rail" aria-label="Registered diagnoses">
      <p id="diagnosis-status" role="status" aria-live="polite">Loading diagnoses…</p>
      <ol id="diagnosis-list"></ol>
    </nav>
    <main id="diagnosis-detail" tabindex="-1">
      <p>Select a diagnosis to see its report and videos.</p>
    </main>
  </div>
  <script src="/diagnoses.js" defer></script>
</body>
</html>
