# One diagnosis (ADR 0035): find the smallest condition under which the policy fails here.
# The start is run untouched first. If it fails reliably, its layout is diagnosed (reduced to the smallest
# set of differences from a nearby passing start). If it does not, the probes below are tried: every
# disturbance family (with its threshold) and rewordings of the instruction, reduced to the smallest change.
# Only one branch runs, so the worst case is the check plus the larger branch (`faultline diagnose --dry-run`).
# Placeholders (REGISTRY_ID, IMAGE_DIGEST) are fake: put your own values in a copy of this file.
faultline: 1
name: diagnose-object-task0
mode: diagnose
policy: {suite: libero_object}
diagnose:
  task: 0
  # Exactly one of: start (a benchmark start; the only choice that can also be probed),
  #   screen: {starts: "10-49", confirm: 4}   (search a range for a failing start; layout only)
  #   import: my-failing-start.json           (your own start file; layout only)
  start: 0
  probes:
    # All ten families. Image families run in two Jobs and the two scene families in a third, because one
    # Job is limited to 40 minutes. [] runs no stress test.
    families: [blur, noise, darken, contrast, jpeg, colour_cast, motion_blur, dead_pixels, viewpoint, lighting]
    rewordings: 10              # 0 for none (1-12). Nemotron writes them on this machine (Token Factory).
    enabled: true               # false = "don't probe": a start that passes just reports "passes untouched"
    # instruction: "pick up the alphabet soup and place it in the basket"
    #   ^ the task's language as the benchmark gives it. Required for rewordings on any task except
    #     libero_object task 0.
  layout: true                  # false = "probe only": skip the layout branch even if the start fails
budget:
  # Sized for the worst branch: the check plus the larger of the layout branch and the probes
  # (see `faultline diagnose --dry-run`; the probe Jobs usually cost about half of their reservation).
  max_spend_usd: 9.0
  max_hours: 5
  max_candidates: 36
nemotron: {hypothesis: true, explain: true}
# Web context for each new case (Tavily source discovery, summarised by Nemotron 3 Nano). Shown as context,
# never as evidence. Skipped silently without a TAVILY_API_KEY in the env file.
research: true
backend:
  kind: nebius
  project: from-cli-profile
  platform: gpu-l40s-a
  preset: 1gpu-16vcpu-64gb
  image: cr.eu-north1.nebius.cloud/REGISTRY_ID/faultline-serverless@sha256:IMAGE_DIGEST
  hf_token_secret: faultline-hf-token
  hourly_usd: 1.7468
