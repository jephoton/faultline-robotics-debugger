# Mode 1, a failing start you bring: debug a LIBERO start state from a scenario candidate file.
# The file (JSON, schema of src/robot_debug/scenario_import.py) must be for the same suite and task as this
# spec. Faultline screens a pool of benchmark starts for passing ones, takes the nearest as the reference,
# confirms the imported start fails (4 of 5), then reduces the difference to the shifts that cause it.
# Placeholders (REGISTRY_ID, IMAGE_DIGEST, the candidate path) are fake: put your own values in a copy.
faultline: 1
name: my-failing-start
mode: scenario
policy: {suite: libero_10}
scenario:
  task: 0
  import: my-failing-start.candidate.json   # path to your scenario candidate file
  pool: "0-19"                              # benchmark starts screened for a passing reference (default 0-19)
  reference: auto
budget:
  max_spend_usd: 3.0
  max_hours: 2
  max_candidates: 36
nemotron: {hypothesis: true, explain: true}
backend:
  kind: nebius
  project: from-cli-profile
  platform: gpu-l40s-a
  preset: 1gpu-16vcpu-64gb
  image: cr.eu-north1.nebius.cloud/REGISTRY_ID/faultline-serverless@sha256:IMAGE_DIGEST
  hf_token_secret: faultline-hf-token
  hourly_usd: 1.7468
