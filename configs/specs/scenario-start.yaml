# Mode 1, a known failing start: screen a reference pool, reduce the failure, report.
# To bring your own failing start instead of a benchmark start, replace `start: 14` with
#   import: my-failing-start.json   (a start-state file for this suite and task; see docs/setup/diagnose.md)
# Placeholders (REGISTRY_ID, IMAGE_DIGEST) are fake: put your own values in a copy of this file.
faultline: 1
name: soup-start14
mode: scenario
policy: {suite: libero_10}
scenario:
  task: 0
  start: 14
  reference: auto
budget:
  # `faultline diagnose --dry-run` puts the worst case of the required Jobs (screen + first reduction) at US$3.09;
  # up to three optional continuations come on top, each only if the spend cap allows it.
  max_spend_usd: 3.5
  max_hours: 2
  max_candidates: 36            # the most the 3000 s reduce deadline fits on LIBERO-10 (the validator allows up to 60)
nemotron: {hypothesis: true, explain: true}
backend:
  kind: nebius
  project: from-cli-profile
  platform: gpu-l40s-a
  preset: 1gpu-16vcpu-64gb
  image: cr.eu-north1.nebius.cloud/REGISTRY_ID/faultline-serverless@sha256:IMAGE_DIGEST
  hf_token_secret: faultline-hf-token
  hourly_usd: 1.7468
