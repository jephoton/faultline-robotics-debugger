# For `faultline replay CASE_DIR --spec replay.yaml`: one small Job re-runs a saved case.
# Placeholders (REGISTRY_ID, IMAGE_DIGEST) are fake: put your own values in a copy of this file.
# To replay against a different checkpoint (for example a retrained policy), add `policy.checkpoint`;
# see docs/setup/diagnose.md. `faultline replay CASE --spec this-file --expect fixed|reproduces` sets the verdict you expect.
faultline: 1
name: replay-soup
mode: replay
budget:
  max_spend_usd: 1.2              # the replay Job's worst case is about US$1.08; measured October 15: US$0.41
  max_hours: 1
backend:
  kind: nebius
  project: from-cli-profile
  platform: gpu-l40s-a
  preset: 1gpu-16vcpu-64gb
  image: cr.eu-north1.nebius.cloud/REGISTRY_ID/faultline-serverless@sha256:IMAGE_DIGEST
  hf_token_secret: faultline-hf-token
  hourly_usd: 1.7468
