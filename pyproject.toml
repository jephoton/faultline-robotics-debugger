[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-debug"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<1.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_debug.viewer" = ["web/*"]
