[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<1.25"]

[project.optional-dependencies]
serverless = ["PyYAML==6.0.3"]
cli = ["PyYAML==6.0.3"]
cloud = ["boto3", "truststore"]

[project.scripts]
faultline = "robot_debug.cli:main"
faultline-viewer = "robot_debug.viewer.server:main"
robot-debug-viewer = "robot_debug.viewer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot_debug.viewer" = ["web/*"]
